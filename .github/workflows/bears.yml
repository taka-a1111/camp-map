name: bears

# 県が公表しているクマの出没情報を取り込み、data/bears.json を更新する（毎週）。
# 更新後は build-and-deploy が動いてサイトに反映される。
on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_bears.py"
  schedule:
    - cron: "37 20 * * 0"   # 毎週月曜 5:37（日本時間）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bears
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PDF の文字を読むツール
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: クマの出没情報を取得
        run: python scripts/fetch_bears.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bears-debug
          path: bears_debug/
          retention-days: 7
          if-no-files-found: ignore
      - name: コミット
        run: bash scripts/commit_push.sh "クマの出没情報を更新" data/bears.json data/camp_muni.json data/bear_geocode_cache.json
