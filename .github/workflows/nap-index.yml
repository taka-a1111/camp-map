name: nap-index

# なっぷの掲載ページ一覧（施設名とURL）を更新する。robots.txt の間隔（30秒）を守るため数時間かかる。
on:
  push:
    branches: [main]
    paths:
      - "scripts/nap_index.py"
  schedule:
    - cron: "23 17 10 * *"   # 毎月11日 2:23（日本時間）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nap-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: なっぷの掲載一覧を更新
        run: python scripts/nap_index.py --max 600
      - name: コミット
        run: bash scripts/commit_push.sh "なっぷの掲載一覧を更新" data/nap_index.json data/nap_listed.json
