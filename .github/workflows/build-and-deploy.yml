name: build-and-deploy

# push：camps.json を作り直して GitHub Pages に公開
# 毎月1回・手動実行：OpenStreetMap からキャンプ場を取り直してから公開
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 1 * *"   # 毎月2日 3:17（日本時間）
  workflow_dispatch:
  workflow_run:
    workflows: [nap-index]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OpenStreetMapからキャンプ場を取得
        if: github.event_name != 'push' || hashFiles('data/osm_raw.json') == ''
        run: python scripts/fetch_osm.py
      - name: 網羅調査リストの住所を位置に変換（新しい住所だけ）
        run: python scripts/geocode.py
      - name: camps.json を作成
        run: python scripts/build_data.py
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm_raw.json data/camps.json data/geocode_cache.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ更新（OpenStreetMap＋手入力データ）"
            git push
          fi
      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site/data
          cp index.html robots.txt .nojekyll _site/
          cp -r css js _site/
          cp data/camps.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
