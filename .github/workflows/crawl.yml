name: crawl-pages

# 毎月、キャンプ場の公式・自治体ページを取得する（crawl/request.txt の push や手動でも実行）。
# 本文と候補リストは一時ファイル（artifact）に保存し、料金が書かれた行だけを data/fee_text.json に抜き出してコミットする。
# 抜き出しは文字パターンで行い、Claude（AI）は使わないので費用はかからない。
on:
  push:
    branches: [main]
    paths:
      - "crawl/request.txt"
  workflow_dispatch:
  schedule:
    - cron: "41 19 3 * *"   # 毎月4日 4:41（日本時間）。結果は次回の見直しで使う

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 候補リスト（無料・格安の野営地）を取得
        if: github.event_name == 'schedule'
        run: python scripts/fetch_checklists.py
      - name: 公式・自治体ページを取得
        run: python scripts/crawl_pages.py --only-unpriced
      - name: 料金が書かれた行を抜き出す
        run: python scripts/fee_excerpts.py
      - name: コミット
        run: bash scripts/commit_push.sh "キャンプ場の料金の記載（公式ページから自動抜き出し）を更新" data/fee_text.json
      - uses: actions/upload-artifact@v4
        with:
          name: crawl-out
          path: crawl_out/
          retention-days: 14
